apply plugin: 'com.android.application'

// Release signing is supplied entirely by the environment so no key material or
// password lives in this file. Export KEYSTORE_PATH and KEYSTORE_PASSWORD (plus
// KEY_ALIAS / KEY_PASSWORD if they differ from the defaults below) before any
// assembleRelease/bundleRelease task. See apps/mobile/ANDROID.md. Debug builds
// need none of this and use the local ~/.android/debug.keystore as usual.
def keystorePath = System.getenv("KEYSTORE_PATH")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
def keystoreAlias = System.getenv("KEY_ALIAS") ?: "upload"
def keystoreKeyPassword = System.getenv("KEY_PASSWORD") ?: keystorePassword
def releaseSigningReady = keystorePath && keystorePassword

// Without this a missing environment yields an unsigned artifact that only fails
// once Play rejects the upload. Fail at configuration time instead.
if (gradle.startParameter.taskNames.any { it ==~ /(?i).*(assemble|bundle)Release.*/ }) {
    if (!releaseSigningReady) {
        throw new GradleException(
            "Release signing is not configured. Export KEYSTORE_PATH and KEYSTORE_PASSWORD " +
            "(and KEY_ALIAS/KEY_PASSWORD if they are not \"upload\"/the store password) " +
            "before running a release task. See apps/mobile/ANDROID.md.")
    }
    if (!file(keystorePath).exists()) {
        throw new GradleException("KEYSTORE_PATH does not point at an existing file: ${keystorePath}")
    }
}

android {
    namespace = "org.wikisubmission.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wikisubmission.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseSigningReady ? signingConfigs.release : null
            // R8 shrink+obfuscate. Deliberately the non-"optimize" default
            // config: the aggressive one is a separate step to evaluate once
            // this has proven itself on-device.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // No `ndk { debugSymbolLevel }` here on purpose: the only native code
            // in the bundle is prebuilt, already-stripped .so files from AARs
            // (libsqlcipher via @capacitor-community/sqlite, libdatastore_shared_counter).
            // They carry .dynsym only — no .symtab/.debug_* — so AGP extracts nothing
            // and the bundle is byte-identical either way (verified). Play's
            // "no debug symbols uploaded" warning cannot be cleared until some
            // native code is built from source.
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
